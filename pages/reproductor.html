        };

        // 1. Obtener el ID desde la URL
        const params = new URLSearchParams(window.location.search);
        const tmdbId = params.get("id");
        
        const visor = document.getElementById("visor");

        // 2. Buscar si existe en la configuración
        const opciones = Object.values(peliculasConfig).find(m => m.tmdb === tmdbId);

        if (opciones) {
            document.title = `Viendo: ${opciones.titulo}`; 
            
            // 3. LÓGICA MULTI-REPRODUCTOR
            if (opciones.urlDirecta) {
                // Opción A: Link directo / personalizado
                visor.src = opciones.urlDirecta;
            } else if (opciones.servidor === "vidapi") {
                // Opción B: Reproductor VidApi
                visor.src = `https://vidapi.ru/embed/movie/${opciones.tmdb}`;
            } else {
                // Opción C: Vimeus (Por defecto si no se especifica 'servidor')
                visor.src = `https://vimeus.com/e/movie?tmdb=${opciones.tmdb}&view_key=${opciones.viewKey}`;
            }
        } else {
            // Pantalla de error
            document.body.innerHTML = `
                <a href="../pages/menu.html" style="color:white; font-size:2.5rem; position:absolute; top:35px; left:40px; text-decoration:none; font-weight:bold; font-family:'Saira', sans-serif;">←</a>
                <div style="display:flex; justify-content:center; align-items:center; height:100vh; background-color:#000; color:white; font-family:'Saira', sans-serif;">
                    <h2 style="font-weight:500;">Error: La película no está registrada en el sistema.</h2>
                </div>`;
        }
        window.addEventListener('DOMContentLoaded', () => {
            // Obtener el ID de la película o serie desde la URL
            const urlParams = new URLSearchParams(window.location.search);
            const idPelicula = urlParams.get('id');

            // Si no hay ID en la URL, no hace nada
            if (!idPelicula) return;

            // Buscar si existe alguna imagen/poster en la página para guardar como portada
            const portadaEl = document.querySelector('.portada-pelicula, #poster, img');
            const imgSrc = portadaEl ? portadaEl.getAttribute('src') : `../img/poster_${idPelicula}.jpg`;

            // Crear el objeto del contenido que se está viendo
            const nuevoVisto = {
                id: idPelicula,
                link: window.location.pathname + window.location.search, // Conserva la ruta completa
                imgSrc: imgSrc,
                altText: document.title || `Película ${idPelicula}`
            };

            // Obtener la lista actual de localStorage
            let listaVistos = JSON.parse(localStorage.getItem('continuarViendo')) || [];

            // Eliminar si ya existía para colocarlo de primero en la lista (evita duplicados)
            listaVistos = listaVistos.filter(item => item.id !== nuevoVisto.id);

            // Agregar al principio del arreglo
            listaVistos.unshift(nuevoVisto);

            // Guardar máximo 15 elementos
            if (listaVistos.length > 15) listaVistos.pop();

            // Guardar en el almacenamiento del navegador
            localStorage.setItem('continuarViendo', JSON.stringify(listaVistos));
        });
    </script>
