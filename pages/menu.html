    <script>
  // 1. Guardar la posición del scroll antes de que el usuario cambie de página
    window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('scrollPositionMenu', window.scrollY);
    });

  // 2. Restaurar la posición del scroll cuando la página se cargue de nuevo
    window.addEventListener('load', () => {
    const savedPosition = sessionStorage.getItem('scrollPositionMenu');
    if (savedPosition) {
      // Usamos un pequeño setTimeout para asegurar que todo el contenido y las imágenes 
      // se hayan renderizado antes de mover el scroll.
        setTimeout(() => {
        window.scrollTo(0, parseInt(savedPosition));
        }, 100); 
        }
    });
    </script>

    <script>
      // Usamos la clase real de tus contenedores horizontales
        const CLASE_CARRUSEL = '.carousel-track'; 

      // 1. GUARDAR POSICIONES ANTES DE SALIR (Al hacer clic en una película/serie)
        window.addEventListener('beforeunload', () => {
        // Guardar scroll vertical de la pantalla
        sessionStorage.setItem('scrollPositionMenu', window.scrollY);

        // Guardar scroll horizontal de cada carrusel de género
        const carruseles = document.querySelectorAll(CLASE_CARRUSEL);
        carruseles.forEach((carrusel, indice) => {
          // Como tus carruseles están dentro de secciones (drama, comedia...), 
          // usamos la clase del padre o el índice para identificarlos perfectamente
            const nombreSeccion = carrusel.closest('section')?.className || `genero_${indice}`;
            sessionStorage.setItem(`scroll_x_${nombreSeccion}`, carrusel.scrollLeft);
        });
        });

      // 2. RESTAURAR POSICIONES AL VOLVER A ENTRAR
        window.addEventListener('load', () => {
        // Un delay de 150ms ayuda a que Bootstrap y tus posters carguen bien antes de mover el scroll
        setTimeout(() => {
        
          // Restaurar la posición horizontal de cada carrusel
            const carruseles = document.querySelectorAll(CLASE_CARRUSEL);
            carruseles.forEach((carrusel, indice) => {
            const nombreSeccion = carrusel.closest('section')?.className || `genero_${indice}`;
            const scrollXGuardado = sessionStorage.getItem(`scroll_x_${nombreSeccion}`);
            if (scrollXGuardado) {
                carrusel.scrollLeft = parseInt(scrollXGuardado);
            }
            });

          // Restaurar la posición vertical general de la pantalla
            const savedPosition = sessionStorage.getItem('scrollPositionMenu');
            if (savedPosition) {
            window.scrollTo(0, parseInt(savedPosition));
            }

        }, 150); 
        });
    </script>
